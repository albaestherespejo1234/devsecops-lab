name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  devsecops:
    name: DevSecOps Analysis & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Análisis de Secretos (Gitleaks)
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2

      # 3. SAST con Semgrep (Análisis de Código Estático)
      - name: SAST Scanning (Semgrep)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto

      # 4. Análisis IaC con Checkov (Infraestructura como Código)
      - name: IaC Security Scanning (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: 'terraform,dockerfile'
          soft_fail: true

      # 5. Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Construir imagen Docker localmente
      - name: Build Docker Image for Analysis
        run: |
          docker build -t app-sec-demo:${{ github.sha }} .

      # 7. Escaneo de Vulnerabilidades en Contenedores (Trivy)
      - name: Container Security Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-sec-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 8. Generación de SBOM (Software Bill of Materials)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'app-sec-demo:${{ github.sha }}'
          artifact-name: 'sbom.spdx.json'

      # 9. Subir Artefacto de SBOM
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.spdx.json