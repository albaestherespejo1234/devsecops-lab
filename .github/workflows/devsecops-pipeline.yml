name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  devsecops:
    name: DevSecOps Analysis & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código (Usando SHA fijado para SAST)
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # 2. Análisis de Secretos (Gitleaks)
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@286b20677a2d8a4e8d38e2ec035f1118fa30c946 # v2.3.9

      # 3. Análisis SAST con Semgrep (Usando CLI nativo fijado para evitar errores de tags)
      - name: SAST Scanning (Semgrep)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error

      # 4. Análisis IaC con Checkov (Terraform/Dockerfile)
      - name: IaC Security Scanning (Checkov)
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # master
        with:
          directory: '.'
          framework: 'terraform,dockerfile'
          soft_fail: true

      # 5. Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c10077c59e7423089456fd7a49ee926ebec58c14 # v3.7.0

      # 6. Construir imagen Docker localmente para escaneo
      - name: Build Docker Image for Analysis
        run: |
          docker build -t app-sec-demo:${{ github.sha }} .

      # 7. Escaneo de Vulnerabilidades en Contenedores (Trivy)
      - name: Container Security Scanning (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf4004029a2777f3a6409368972 # master
        with:
          image-ref: 'app-sec-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 8. Generación de SBOM (Syft/Anchore)
      - name: Generate SBOM
        uses: anchore/sbom-action@68d0e7425ed51624c9c7f607144e503e1e2d93e7 # v0.17.0
        with:
          image: 'app-sec-demo:${{ github.sha }}'
          artifact-name: 'sbom.spdx.json'

      # 9. Subir Artifact de SBOM
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-report
          path: sbom.spdx.json